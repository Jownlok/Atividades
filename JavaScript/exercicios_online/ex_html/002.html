<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ex_css/002.css">
    <title>Calculadora Simples</title>
</head>
<body>

    <div class="header"><h1>Calculadora Simples</h1></div>

    <div class="menu">
        <input type="text" id="blocoum">
        <select id="escolha">
            <option value="somar">+</option>
            <option value="subtrair">-</option>
            <option value="multiplicar">x</option>
            <option value="dividir">/</option>
        </select> 
        <input type="text" id="blocodois">
        <button id="confirmar">=</button>
        <div id="resultado">0</div>
    </div>
    


    <script src="../002.js"></script>
</body>
</html>
