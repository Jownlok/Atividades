<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 002 Tabela</title>
</head>
<body>
    <table border="1"> <!-- Td = linha, Th = coluna-->
        <caption>Economia Mensal</caption> <!-- Comentário da tabela -->
        <tr>
            <th colspan="3">&nbsp;&nbsp;</th> <!--Cosplan = quanto ocupa a linha-->
        </tr>
        <tr>
            <td colspan="1.5">&nbsp;</td>
            <td colspan="1.5">&nbsp;</td>
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
        </tr>
    </table>
</body>
</html>
